# Pen-plotter macros for the Grasshopper -> Voron pen-plot pipeline.

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

[gcode_macro PEN_PAUSE]
description: Lift, go to load point, drop to pen height, pause without parking (for pen insertion)
gcode:
    {% set z = params.Z|default(2.0)|float %}
    {% set x = params.X|default(175)|float %}
    {% set y = params.Y|default(40)|float %}
    {% set lift = params.LIFT|default(20)|float %}
    {% set pen = params.PEN|default(0)|int %}
    {% set color = params.COLOR|default('')|string %}
    G90
    G1 Z{z + lift} F3000
    G1 X{x} Y{y} F9000
    G1 Z{z} F1000
    M400
    {% if pen > 0 %}
    SET_DISPLAY_TEXT MSG="Load PEN {pen} [{color}], seat to surface, then PEN_RESUME"
    {% else %}
    SET_DISPLAY_TEXT MSG="Insert pen to surface, then run PEN_RESUME"
    {% endif %}
    PAUSE_BASE

[gcode_macro PEN_RESUME]
description: Resume after PEN_PAUSE - no un-retract, no parking
gcode:
    SET_DISPLAY_TEXT MSG="Plotting..."
    RESUME_BASE

[gcode_macro PEN_RESTORE_LIMITS]
description: Restore accel / square corner velocity to printer.cfg defaults after a plot
gcode:
    {% set cfg = printer.configfile.settings.printer %}
    SET_VELOCITY_LIMIT ACCEL={cfg.max_accel} SQUARE_CORNER_VELOCITY={cfg.square_corner_velocity|default(5)}

# ---- Paper registration: jog pen tip to a corner, press the matching button ----

[gcode_macro PAPER_SET_FL]
description: Save current pen position as paper FRONT-LEFT corner (P0)
gcode:
    {% set p = printer.gcode_move.gcode_position %}
    SAVE_VARIABLE VARIABLE=paper_p0 VALUE="{[p.x|round(3), p.y|round(3)]}"
    SET_DISPLAY_TEXT MSG="Paper FL (P0) saved: {p.x|round(1)}, {p.y|round(1)}"

[gcode_macro PAPER_SET_FR]
description: Save current pen position as paper FRONT-RIGHT corner (P1)
gcode:
    {% set p = printer.gcode_move.gcode_position %}
    SAVE_VARIABLE VARIABLE=paper_p1 VALUE="{[p.x|round(3), p.y|round(3)]}"
    SET_DISPLAY_TEXT MSG="Paper FR (P1) saved: {p.x|round(1)}, {p.y|round(1)}"

[gcode_macro PAPER_SET_BL]
description: Save current pen position as paper BACK-LEFT corner (P2)
gcode:
    {% set p = printer.gcode_move.gcode_position %}
    SAVE_VARIABLE VARIABLE=paper_p2 VALUE="{[p.x|round(3), p.y|round(3)]}"
    SET_DISPLAY_TEXT MSG="Paper BL (P2) saved: {p.x|round(1)}, {p.y|round(1)}"

[gcode_macro PLOT_HOME_QGL]
description: Conditional homing + QGL for pen plots - skips whatever is already valid
gcode:
    {% set do_qgl = params.QGL|default(1)|int %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
    SET_DISPLAY_TEXT MSG="Homing..."
    G28
    {% else %}
    RESPOND TYPE=echo MSG="PLOT: already homed, skipping G28"
    {% endif %}
    {% if do_qgl %}
    {% if not printer.quad_gantry_level.applied %}
    SET_DISPLAY_TEXT MSG="Quad gantry leveling..."
    QUAD_GANTRY_LEVEL
    G28 Z
    {% else %}
    RESPOND TYPE=echo MSG="PLOT: QGL already applied, skipping"
    {% endif %}
    {% endif %}

[gcode_macro PEN_COLLET]
description: Park at the pen-collet setup position for fitting a pen into the QR collet
gcode:
    {% set px = params.X|default(19.5)|float %}
    {% set py = params.Y|default(70.5)|float %}
    {% set pz = params.Z|default(120)|float %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
    SET_DISPLAY_TEXT MSG="Homing for collet setup..."
    G28
    {% endif %}
    G90
    G0 Z{pz} F1500
    G0 X{px} Y{py} F6000
    M400
    SET_DISPLAY_TEXT MSG="Collet setup position - fit the pen"
    RESPOND TYPE=echo MSG="At collet setup position X{px} Y{py} Z{pz}"

# =============================================================================
# PEN TOOL TABLE - each pen slot stores its own XYZ datum (like CNC tool
# offsets). Pass order (pen 1,2,3...) is INDEPENDENT of a pen's calibration:
# swapping the plotting order never invalidates it.
#
# Procedure per pen:
#   1) PEN_COLLET            park high, fit the pen from underneath
#   2) PEN_CAL_POS           drop to the calibration point at nominal draw Z
#   3) adjust the pen in the collet (or jog Z) until the tip just touches
#   4) PEN_CALIBRATE PEN=n   stores that exact position for pen n
# Pen 1 is the datum; every other pen is stored as an offset from it.
# =============================================================================

[gcode_macro PEN_CAL_POS]
description: Put the PEN TIP at the calibration dot (X/Y are the DOT's bed coords)
gcode:
    # Plain NOZZLE coordinates - no hidden compensation. These defaults were
    # measured: with the nozzle here, the pen tip sits on the calibration dot.
    {% set px = params.X|default(19.5)|float %}
    {% set py = params.Y|default(76.6)|float %}
    {% set pz = params.Z|default(16.0)|float %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
    {% endif %}
    G90
    G0 Z{[pz + 20, 40]|max} F1500
    G0 X{px} Y{py} F6000
    G0 Z{pz} F600
    M400
    SET_DISPLAY_TEXT MSG="Adjust pen until it just touches, then PEN_CALIBRATE"
    RESPOND TYPE=echo MSG="Nozzle X{px} Y{py} Z{pz} - jog the tip onto the dot, then PEN_CALIBRATE PEN=n"

[gcode_macro PEN_CALIBRATE]
description: Store the current toolhead position as this pen's datum. PEN=1..8
gcode:
    {% set n = params.PEN|default(1)|int %}
    {% set p = printer.toolhead.position %}
    SAVE_VARIABLE VARIABLE=pen_cal_{n} VALUE="[{p[0]|round(3)}, {p[1]|round(3)}, {p[2]|round(3)}]"
    RESPOND TYPE=echo MSG="PEN {n} calibrated at X{p[0]|round(2)} Y{p[1]|round(2)} Z{p[2]|round(2)}"
    SET_DISPLAY_TEXT MSG="Pen {n} calibrated"

[gcode_macro PEN_APPLY]
description: Apply a calibrated pen's offset (relative to pen 1). PEN=1..8
gcode:
    {% set n = params.PEN|default(1)|int %}
    {% set sv = printer.save_variables.variables %}
    {% set me = sv.get('pen_cal_' ~ n) %}
    {% set ref = sv.get('pen_cal_1') %}
    {% if me and ref %}
    SET_GCODE_OFFSET X={(me[0] - ref[0])|round(3)} Y={(me[1] - ref[1])|round(3)} Z={(me[2] - ref[2])|round(3)} MOVE=0
    RESPOND TYPE=echo MSG="Pen {n} offsets applied: X{(me[0]-ref[0])|round(2)} Y{(me[1]-ref[1])|round(2)} Z{(me[2]-ref[2])|round(2)}"
    {% elif me %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    RESPOND TYPE=echo MSG="Pen {n} stored but pen 1 (datum) is not calibrated - offsets zeroed"
    {% else %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    RESPOND TYPE=echo MSG="Pen {n} has no calibration - offsets zeroed"
    {% endif %}

[gcode_macro PEN_TABLE]
description: Report the stored pen calibrations
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set ref = sv.get('pen_cal_1') %}
    RESPOND TYPE=echo MSG="--- PEN TOOL TABLE (datum = pen 1) ---"
    {% for n in range(1, 9) %}
      {% set me = sv.get('pen_cal_' ~ n) %}
      {% if me %}
        {% if ref %}
    RESPOND TYPE=echo MSG="pen {n}: X{me[0]|round(2)} Y{me[1]|round(2)} Z{me[2]|round(2)}  offset dX{(me[0]-ref[0])|round(2)} dY{(me[1]-ref[1])|round(2)} dZ{(me[2]-ref[2])|round(2)}"
        {% else %}
    RESPOND TYPE=echo MSG="pen {n}: X{me[0]|round(2)} Y{me[1]|round(2)} Z{me[2]|round(2)}"
        {% endif %}
      {% endif %}
    {% endfor %}

[gcode_macro PEN_CLEAR_CAL]
description: Forget a pen's calibration. PEN=1..8
gcode:
    {% set n = params.PEN|default(0)|int %}
    SAVE_VARIABLE VARIABLE=pen_cal_{n} VALUE="None"
    RESPOND TYPE=echo MSG="Pen {n} calibration cleared"


#   save_variables  pen_cal_N = [x, y, z]   absolute position where pen N's
#                                           tip touches the calibration dot
#   PEN_APPLY N     sets gcode offset to (pen_cal_N - pen_cal_1)
# If PEN_APPLY computes its offset differently, the arithmetic in PEN_COMMIT
# must be changed to match it - see the note at the bottom.

# ---------------------------------------------------------------------------
# PEN_COMMIT - make a mid-plot babystep permanent.
#
# You are plotting, the pen sits a little high or a little off, so you nudge it
# with the live trim. That nudge dies at the end of the job. PEN_COMMIT folds it
# into this pen's stored datum so the correction is there next time too.
#
# Nothing moves when you run it. The live offset is left exactly as it is, and
# the datum is changed by precisely the amount that makes PEN_APPLY reproduce
# that same offset - so committing mid-pass cannot disturb the drawing.
# ---------------------------------------------------------------------------
[gcode_macro PEN_COMMIT]
description: Fold the current live X/Y/Z trim into pen N's stored datum (nothing moves)
gcode:
    {% set n = params.PEN|default(0)|int %}
    {% set sv = printer.save_variables.variables %}
    {% set key = 'pen_cal_' ~ n %}
    {% if n < 1 or n > 8 %}
        { action_raise_error("PEN_COMMIT: PEN must be 1-8") }
    {% elif n == 1 %}
        { action_raise_error("PEN_COMMIT: pen 1 IS the datum - its stored value is what
          every other pen is measured against, so a trim on pen 1 cannot be folded into
          the table (it would just re-zero itself). A pen 1 height error is a global draw
          height error: change pen_down_z in Grasshopper instead. To move the datum
          itself, re-run PEN_CALIBRATE PEN=1 at the cal dot.") }
    {% elif key not in sv %}
        { action_raise_error("PEN_COMMIT: pen " ~ n ~ " has no stored datum - run PEN_CALIBRATE PEN=" ~ n ~ " first") }
    {% elif 'pen_cal_1' not in sv %}
        { action_raise_error("PEN_COMMIT: pen 1 (the datum) is not calibrated yet") }
    {% else %}
        {% set me = sv[key] %}
        {% set ref = sv.pen_cal_1 %}
        {% set ho = printer.gcode_move.homing_origin %}
        # what PEN_APPLY would have set for this pen
        {% set ax = me[0] - ref[0] %}
        {% set ay = me[1] - ref[1] %}
        {% set az = me[2] - ref[2] %}
        # ...so anything beyond that is the trim the operator dialled in by hand
        {% set tx = ho.x - ax %}
        {% set ty = ho.y - ay %}
        {% set tz = ho.z - az %}
        {% if tx|abs < 0.0005 and ty|abs < 0.0005 and tz|abs < 0.0005 %}
            RESPOND PREFIX=PEN MSG="pen {n} already matches its stored datum - no trim to commit"
        {% else %}
            SAVE_VARIABLE VARIABLE={key} VALUE="[{me[0] + tx}, {me[1] + ty}, {me[2] + tz}]"
            RESPOND PREFIX=PEN MSG="pen {n} datum updated by dX{'%+.3f'|format(tx)} dY{'%+.3f'|format(ty)} dZ{'%+.3f'|format(tz)} - live offset unchanged, nothing moved"
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------------------
# PEN_TWEAK - nudge a stored datum without being mid-plot.
#
# For "I calibrated that one a bit too high" after the fact. Edits the stored
# value directly. If that pen's offset is currently applied, the live offset is
# updated to match, which DOES move the toolhead by the tweak amount.
#
#   PEN_TWEAK PEN=3 Z=-0.2      lower pen 3 by 0.2mm, permanently
#   PEN_TWEAK PEN=2 X=0.1 Y=-0.3
# ---------------------------------------------------------------------------
[gcode_macro PEN_TWEAK]
description: Adjust a stored pen datum by a delta (PEN=n X= Y= Z=)
gcode:
    {% set n = params.PEN|default(0)|int %}
    {% set dx = params.X|default(0)|float %}
    {% set dy = params.Y|default(0)|float %}
    {% set dz = params.Z|default(0)|float %}
    {% set sv = printer.save_variables.variables %}
    {% set key = 'pen_cal_' ~ n %}
    {% if n < 1 or n > 8 %}
        { action_raise_error("PEN_TWEAK: PEN must be 1-8") }
    {% elif key not in sv %}
        { action_raise_error("PEN_TWEAK: pen " ~ n ~ " has no stored datum") }
    {% elif dx == 0 and dy == 0 and dz == 0 %}
        { action_raise_error("PEN_TWEAK: give at least one of X= Y= Z=") }
    {% else %}
        {% set me = sv[key] %}
        SAVE_VARIABLE VARIABLE={key} VALUE="[{me[0] + dx}, {me[1] + dy}, {me[2] + dz}]"
        RESPOND PREFIX=PEN MSG="pen {n} datum tweaked dX{'%+.3f'|format(dx)} dY{'%+.3f'|format(dy)} dZ{'%+.3f'|format(dz)}"
        # if this pen is the one currently loaded, keep the live offset in step
        {% if printer['gcode_macro PEN_APPLY'] is defined and sv.get('pen_active', 0)|int == n %}
            PEN_APPLY PEN={n}
            RESPOND PREFIX=PEN MSG="pen {n} is active - offset re-applied (toolhead moved by the tweak)"
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------------------
# If PEN_APPLY does NOT use (pen_cal_N - pen_cal_1):
#
# PEN_COMMIT only needs to know what offset PEN_APPLY would set for this pen -
# that is the `ax/ay/az` block. Everything else follows. Replace those three
# lines with whatever PEN_APPLY computes and the rest stays correct.
# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# PLOT_CAM_PARK - get the gantry out of the camera's way.
#
# An overhead camera looks straight through the X beam, so a frame taken with
# the gantry parked over the sheet is useless. Park it at the BACK, which the
# pen cannot reach anyway because of the 58mm pen offset - so this costs no
# printable area.
#
# Z is raised as well: the closer the beam sits to the camera, the wider the
# strip of bed it hides.
#
# Ends in M400 so the caller only gets control back once the move has actually
# finished, rather than when it has been queued.
# ---------------------------------------------------------------------------
[gcode_macro PLOT_CAM_PARK]
description: Park the gantry clear of an overhead camera, then wait for the move
variable_park_y: 348          # bed back edge; inside the pen's dead zone
variable_park_x: 175          # centred, so the toolhead shadows as little as possible
variable_park_z: 120
gcode:
    {% set vx = params.X|default(printer["gcode_macro PLOT_CAM_PARK"].park_x)|float %}
    {% set vy = params.Y|default(printer["gcode_macro PLOT_CAM_PARK"].park_y)|float %}
    {% set vz = params.Z|default(printer["gcode_macro PLOT_CAM_PARK"].park_z)|float %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SAVE_GCODE_STATE NAME=cam_park
    G90
    G1 Z{vz} F1200
    G1 X{vx} Y{vy} F9000
    M400
    RESTORE_GCODE_STATE NAME=cam_park
    RESPOND PREFIX=CAM MSG="parked at X{vx} Y{vy} Z{vz} - frame is clear"

# ---------------------------------------------------------------------------
# PLOT_CAM_LIGHT - even lighting makes the paper/bed threshold reliable.
# Wire this to whatever the daylight_led config exposes; left as a stub because
# the LED name has to match daylight_led.cfg on the printer.
# ---------------------------------------------------------------------------
[gcode_macro PLOT_CAM_LIGHT]
description: Turn the bed lighting to a known level for a camera capture
gcode:
    {% set on = params.ON|default(1)|int %}
    # SET_LED LED=daylight WHITE={1.0 if on else 0.0} SYNC=0
    RESPOND PREFIX=CAM MSG="light stub - point this at the LED in daylight_led.cfg"
