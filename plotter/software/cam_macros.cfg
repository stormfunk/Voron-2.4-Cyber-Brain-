# Camera support macros for optical paper registration.
#
# APPEND TO pen_macros.cfg ON THE PRINTER (or include this file).

# ---------------------------------------------------------------------------
# PLOT_CAM_PARK - get the gantry out of the camera's way.
#
# An overhead camera looks straight through the X beam, so a frame taken with
# the gantry parked over the sheet is useless. Park it at the BACK, which the
# pen cannot reach anyway because of the 58mm pen offset - so this costs no
# printable area.
#
# Z is raised as well: the closer the beam sits to the camera, the wider the
# strip of bed it hides.
#
# Ends in M400 so the caller only gets control back once the move has actually
# finished, rather than when it has been queued.
# ---------------------------------------------------------------------------
[gcode_macro PLOT_CAM_PARK]
description: Park the gantry clear of an overhead camera, then wait for the move
variable_park_y: 348          # bed back edge; inside the pen's dead zone
variable_park_x: 175          # centred, so the toolhead shadows as little as possible
variable_park_z: 120
gcode:
    {% set vx = params.X|default(printer["gcode_macro PLOT_CAM_PARK"].park_x)|float %}
    {% set vy = params.Y|default(printer["gcode_macro PLOT_CAM_PARK"].park_y)|float %}
    {% set vz = params.Z|default(printer["gcode_macro PLOT_CAM_PARK"].park_z)|float %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SAVE_GCODE_STATE NAME=cam_park
    G90
    G1 Z{vz} F1200
    G1 X{vx} Y{vy} F9000
    M400
    RESTORE_GCODE_STATE NAME=cam_park
    RESPOND PREFIX=CAM MSG="parked at X{vx} Y{vy} Z{vz} - frame is clear"

# ---------------------------------------------------------------------------
# PLOT_PROBE_GUARD - stop before anything that probes the bed.
#
# QGL and bed mesh drive the NOZZLE down until it touches. Every pen in the
# holder sits BELOW the nozzle (pen 3 by 7.5mm), so a loaded pen takes the
# impact before the probe ever triggers and is bent or crushed.
#
# The plot order already puts the pen load AFTER probing, at PEN_PAUSE - but
# that is only a convention, and it is easy to have a pen in from calibrating.
# This makes it a stop rather than an assumption.
# ---------------------------------------------------------------------------
[gcode_macro PLOT_PROBE_GUARD]
description: Pause before probing so a loaded pen can be removed first
gcode:
    {% set do_qgl = params.QGL|default(1)|int %}
    # Only stop if something is ACTUALLY going to probe. Already homed and
    # already levelled means the run touches nothing, and a guard that cries
    # wolf on every plot just teaches you to click through it - which is
    # exactly when it needs to be believed.
    {% set will_home = "xyz" not in printer.toolhead.homed_axes %}
    {% set will_qgl = do_qgl and not printer.quad_gantry_level.applied %}
    {% if will_home or will_qgl %}
        RESPOND TYPE=error MSG="PROBING NEXT ({% if will_home %}G28 {% endif %}{% if will_qgl %}QGL{% endif %}). The pen sits BELOW the nozzle and will be crushed. Take it OUT, then RESUME - it goes back in at the pen-load pause."
        SET_DISPLAY_TEXT MSG="REMOVE PEN - then RESUME"
        PAUSE
    {% else %}
        RESPOND PREFIX=PLOT MSG="probe guard: already homed and levelled, nothing will touch the bed"
    {% endif %}

# ---------------------------------------------------------------------------
# PLOT_CAM_LIGHT - put the chamber light at a known level for a capture.
#
# The rule is ONE CONTROLLED LIGHT: this strip on at full, and the room light
# OFF. The second half is the one that bites.
#
# The bed is smooth, so a light does not illuminate it so much as reflect off
# it, and a source at the wrong angle puts a specular patch straight into the
# overhead camera. A room lamp did exactly that - it washed out the lower third
# of the frame, took the entire bottom row of marks with it, and merged two
# tape patches into a single 137k-pixel blob. It looked identical with this
# strip at 0 and at 1.0, which is what proves the strip was never the cause.
#
# With the room dark, brightness was swept across this strip's range: full gave
# 8 of 9 marks and 5.7% clipping, against a degenerate 4-point fit at quarter
# brightness and a failed match at half. So: full.
#
# Do not judge this by average frame brightness. Auto-exposure holds the mean
# near constant (~105 from full brightness to off) while the glare changes
# completely. Judge it by how many marks survive detection.
#
# Pinning the camera exposure manually was tried and abandoned: crowsnest
# applies v4l2 controls BEFORE ustreamer opens the device and the driver resets
# them on format set, so the value never sticks. A sweep of 5/50/156/1000/10000
# came back non-monotonic (156 darker than both 50 and 1000), which is the
# signature of a control that is not being held.
# ---------------------------------------------------------------------------
[gcode_macro PLOT_CAM_LIGHT]
description: Set the chamber light for a camera capture (ON=1, the default)
gcode:
    {% set on = params.ON|default(1)|int %}
    {% set lvl = 1.0 if on else 0.0 %}
    SET_LED LED=daylight RED={lvl} GREEN={lvl} BLUE={lvl} SYNC=0 TRANSMIT=1
    RESPOND PREFIX=CAM MSG="chamber light {'ON (full)' if on else 'OFF'} - room light must be off either way"
